name: Publish site

# Rebuilds index.html from digests/ and discovery/ and deploys to GitHub Pages.
# Replaces the local publish.ps1 + Windows Task Scheduler job.
# Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "digests/**"
      - "discovery/**"
      - "index.html"
      - "scripts/**"
      - "ci-tools/**"
      - "favicon.ico"
      - "robots.txt"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
