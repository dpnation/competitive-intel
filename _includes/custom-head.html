<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Applause Brand ─────────────────────────────────── */
  :root {
    --blue-50:  #F7FBFE;
    --blue-100: #E6F3FA;
    --blue-500: #0272B4;
    --blue-700: #01446C;
    --aqua-500: #00C0A3;
    --gray-200: #F0F0F0;
    --gray-700: #3D3D3D;
  }

body { font-family: 'Nunito Sans', Arial, Helvetica, sans-serif; color: var(--gray-700); }

  /* Header */
  .site-header {
    background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
    border-top: none; border-bottom: none; padding: 14px 0;
  }
  .site-header .site-title,
  .site-header .site-title:visited { color: #fff !important; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; font-size: 1rem; }
  .site-header .site-title:hover   { color: rgba(255,255,255,0.8) !important; text-decoration: none; }

  /* Headings */
  h1, h2, h3 { color: var(--blue-700); font-weight: 800; }
  h2 { font-size: 1.2rem; padding-bottom: 0.35rem; border-bottom: 3px solid var(--aqua-500); display: inline-block; margin-bottom: 1rem; }

  /* Links */
  a       { color: var(--blue-500); }
  a:hover { color: var(--blue-700); }

  /* Report archive table */
  table { width: 100%; border-collapse: collapse; margin: 0.5rem 0 2rem; font-size: 0.95rem; }
  table th {
    background: linear-gradient(90deg, var(--blue-700), var(--blue-500));
    color: #fff; padding: 0.65rem 1rem; text-align: left;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  }
  table td { padding: 0.7rem 1rem; border-bottom: 1px solid var(--gray-200); vertical-align: top; }
  table tr:nth-child(even) td { background-color: var(--blue-50); }
  table tr:hover td           { background-color: var(--blue-100); }
  table td a { color: var(--blue-500); font-weight: 600; text-decoration: none; }
  table td a:hover { text-decoration: underline; color: var(--blue-700); }

  /* Footer */
  .site-footer { background-color: var(--blue-700); border-top: none; padding: 1.25rem 0; margin-top: 3rem; }
  .site-footer .footer-attribution { margin: 0; font-size: 0.85rem; color: rgba(255,255,255,0.7); }
  .site-footer a, .site-footer a:visited { color: var(--aqua-500) !important; }
  .site-footer a:hover { color: #fff !important; text-decoration: none; }
</style>
